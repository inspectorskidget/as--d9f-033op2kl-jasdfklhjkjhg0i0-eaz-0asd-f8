<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rezi.lol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0f;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #1a1a24;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .logo span { color: #a855f7; }
    nav { display: flex; gap: 2rem; }
    nav a {
      font-weight: 600;
      font-size: 0.9rem;
      color: #888;
      transition: color 0.2s;
    }
    nav a:hover { color: #fff; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; text-align: center; }
    .hero h1 {
      font-size: 4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1.5px;
      line-height: 1.1;
    }
    .hero h1 span { color: #a855f7; }
    .hero p {
      margin-top: 1rem;
      font-size: 1.15rem;
      color: #666;
      max-width: 500px;
    }
    .buttons { margin-top: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #a855f7;
      color: #fff;
    }
    .btn-primary:hover { background: #9333ea; transform: translateY(-2px); }
    .btn-secondary {
      background: #1a1a24;
      color: #e0e0e0;
    }
    .btn-secondary:hover { background: #252530; transform: translateY(-2px); }
    footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid #1a1a24;
      text-align: center;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">rezi<span>.lol</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="scripts.html">Scripts</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1 id="site-title">rezi<span>.lol</span></h1>
      <p id="site-tagline">Premium scripts & commissions for Roblox. Quality you can trust.</p>
      <div class="buttons">
        <a href="scripts.html" class="btn btn-primary">View Scripts</a>
        <a href="scripts.html" class="btn btn-secondary">Commissions</a>
      </div>
    </section>
  </main>
  <footer id="site-footer">All rights are rezi'd</footer>
  <script>
    fetch('data.json').then(r => r.json()).then(d => {
      document.getElementById('site-title').innerHTML = d.site.title.replace('.lol', '<span>.lol</span>');
      document.getElementById('site-tagline').textContent = d.site.tagline;
      document.getElementById('site-footer').textContent = d.site.footer;
    });
  </script>
</body>
</html>
